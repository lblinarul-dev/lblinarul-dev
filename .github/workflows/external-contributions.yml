name: Update external contributions

on:
  schedule:
    # Refresh the profile dashboard every day at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: profile-dashboard-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Update external contributions table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_external_contributions.py

      - name: Refresh dashboard image cache
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          version = datetime.now(timezone.utc).strftime("%Y%m%d%H")

          pattern = re.compile(
              r'https://(?:github-readme-stats\.vercel\.app|streak-stats\.demolab\.com|'
              r'github-readme-activity-graph\.vercel\.app|'
              r'raw\.githubusercontent\.com/lblinarul-dev/lblinarul-dev/main/assets/github-contribution-grid-snake)'
              r'[^"\s>]*'
          )

          def add_version(match):
              url = match.group(0)
              parts = urlsplit(url)
              query = [(key, value) for key, value in parse_qsl(parts.query, keep_blank_values=True) if key != "v"]
              query.append(("v", version))
              return urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment))

          updated = pattern.sub(add_version, text)
          path.write_text(updated, encoding="utf-8")
          print(f"Dashboard cache version: {version}")
          PY

      - name: Commit changes if README changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached || git commit -m "chore: refresh dashboard cache"
          git push origin HEAD:main
