name: Update external contributions

on:
  schedule:
    # Refresh the profile dashboard every day at 06:00 UTC.
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Prevent this workflow from racing with itself while updating main.
concurrency:
  group: profile-dashboard-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Update external contributions table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_external_contributions.py

      - name: Refresh dashboard image cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from datetime import datetime, timezone

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          version = datetime.now(timezone.utc).strftime("%Y%m%d%H")

          # Replace the previous cache-buster, or add one to dashboard image URLs.
          text = re.sub(r"([?&])v=\d{10}", r"\1v=" + version, text)

          patterns = [
              r"(github-readme-stats\\.vercel\\.app/[^\"\\s>]+)",
              r"(streak-stats\\.demolab\\.com/[^\"\\s>]+)",
              r"(github-readme-activity-graph\\.vercel\\.app/[^\"\\s>]+)",
              r"(raw\\.githubusercontent\\.com/lblinarul-dev/lblinarul-dev/main/assets/github-contribution-grid-snake[^\"\\s>]+)",
          ]

          for pattern in patterns:
              def add_version(match):
                  url = match.group(1)
                  if "v=" in url:
                      return url
                  separator = "&" if "?" in url else "?"
                  return url + separator + "v=" + version
              text = re.sub(pattern, add_version, text)

          path.write_text(text, encoding="utf-8")
          print(f"Dashboard cache version: {version}")
          PY

      - name: Commit changes if README changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached || git commit -m "chore: refresh dashboard cache"
          git push origin HEAD:main
