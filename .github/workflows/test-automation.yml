name: Test automation scripts

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/test-automation.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/test-automation.yml"
  workflow_dispatch: {}

concurrency:
  group: test-automation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run offline test suite
        env:
          GH_USERNAME: testuser
          GH_TOKEN: fake-token-for-tests
        run: python3 scripts/tests/test_update_external_contributions.py
